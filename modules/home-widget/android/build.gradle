// See the note in modules/audio-eq/android/build.gradle: the plugin is what
// brings the compiler plugin the module DSL needs from SDK 56 on.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.homewidget'
version = '0.0.1'

android {
  namespace "expo.modules.homewidget"
  defaultConfig {
    versionCode 1
    versionName "0.0.1"
  }
}

dependencies {
  // The buttons press media keys through the system and the artwork is
  // fetched with what the SDK already has; the one thing beyond the platform
  // is React Native itself, for the host the provider starts when play or a
  // queue row arrives with no JavaScript running (see JsRuntime.kt). The
  // version is the app's: the React Native gradle plugin resolves it for
  // every project.
  implementation 'com.facebook.react:react-android'
}

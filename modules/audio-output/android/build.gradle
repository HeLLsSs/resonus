// The plugin, not the old `ExpoModulesCorePlugin.gradle` helpers: since SDK 56
// it also applies the Kotlin compiler plugin that resolves the reified types
// the module DSL relies on. Without it a module still compiles, and then throws
// "this function has a reified type parameter and thus can only be inlined at
// compilation time" the moment it registers.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.audiooutput'
version = '0.0.1'

android {
  namespace "expo.modules.audiooutput"
  defaultConfig {
    versionCode 1
    versionName "0.0.1"
  }
}

dependencies {
  // Everything here is the framework's own (android.media.AudioManager): nothing else.
}

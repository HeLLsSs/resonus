// See the note in modules/audio-eq/android/build.gradle: the plugin is what
// brings the compiler plugin the module DSL needs from SDK 56 on.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.alarm'
version = '0.0.1'

android {
  namespace "expo.modules.alarm"
  defaultConfig {
    versionCode 1
    versionName "0.0.1"
  }
}

// No dependency of its own: alarms and broadcasts are the framework's, and
// starting JS when the alarm rings is the intents API's job (modules/intents-api).

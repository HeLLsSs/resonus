// The plugin, not the old `ExpoModulesCorePlugin.gradle` helpers: since SDK 56
// it also applies the Kotlin compiler plugin that resolves the reified types
// the module DSL relies on.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.tvfocus'
version = '0.0.1'

android {
  namespace "expo.modules.tvfocus"
  defaultConfig {
    versionCode 1
    versionName "0.0.1"
  }
}

dependencies {
  // Framework views and nothing else.
}
